# Balanceador de carga do UML8: TLS, única porta de entrada, distribui para as duas
# réplicas do omega-server na porta 8080. Spec: 3.8, Q-11, Q-12, Q-14.
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Logs sem IP do cliente e sem query string: IP é dado pessoal (C-09, Q-14).
    log_format omega '$time_iso8601 $request_method $uri $status $request_time '
                     'replica=$upstream_addr id=$request_id';
    access_log /dev/stdout omega;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;

    # DNS do Docker: réplica parada sai do balanceamento; recriada volta com o novo IP.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream omega_server {
        zone omega_server 64k;
        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/omega.crt;
        ssl_certificate_key /etc/nginx/certs/omega.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:TLS:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        # Qual réplica atendeu (Q-11): só infraestrutura, a API não muda.
        add_header X-Omega-Replica $upstream_addr always;

        location / {
            proxy_pass http://omega_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            # Limite de tentativas de entrada do painel por IP (Q-22): o IP só é usado em
            # memória pela réplica, nunca registrado (C-09).
            proxy_set_header X-Real-IP $remote_addr;

            # Queda de uma réplica não interrompe o serviço (implantacao.feature).
            proxy_connect_timeout 1s;
            proxy_read_timeout 20s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
