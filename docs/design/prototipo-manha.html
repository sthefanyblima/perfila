<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfila · Protótipo navegável (Manhã)</title>
<!-- Demonstração: entre com rita (Administrador), caio (Analista) ou bia (Atendimento), com qualquer senha. O portal do titular abre em #/titular/entrar. Recarregar a página reinicia os dados. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;--surf:#FFFFFF;--ink:#1F1A33;--muted:#6B6580;--line:#E8E0D2;--line-strong:#8A84A0;
  --pri:#5B3DF5;--pri-ink:#fff;--pri-t:#F0ECFF;--acc:#FF7A45;--acc-t:#FFE3D6;
  --ok:#0B7A52;--ok-t:#D9F5E9;--warn:#9A5700;--warn-t:#FFEFC9;--crit:#BF283F;--crit-t:#FFE1E5;--neu:#6B6580;--neu-t:#ECE8F2;
  --band:#5B3DF5;--band-ink:#fff;--band-mute:#EAE5FF;--lit:#FFDCCB;--blob1:#FFD9C7;--blob2:#DCD3FF;
  --disp:"Bricolage Grotesque",sans-serif;--sans:"DM Sans",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;--r:18px;--ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
html{scroll-behavior:smooth}
body{font:400 15.5px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.mono{font-family:var(--mono);font-size:12px}.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;transition:transform 1.2s var(--ease)}
.bg i:nth-child(1){width:44vw;height:44vw;right:-14vw;top:-18vw;background:var(--blob1);opacity:.55}
.bg i:nth-child(2){width:32vw;height:32vw;left:-10vw;bottom:-12vw;background:var(--blob2);opacity:.55}

/* ---------- moldura ---------- */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;padding:16px 0 16px 16px;z-index:20}
.sbox{background:var(--surf);border:1px solid var(--line);border-radius:30px;height:100%;padding:20px 14px 14px;display:flex;flex-direction:column;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font:800 24px var(--disp);letter-spacing:-.02em;padding:0 8px 18px}
.logo i{width:30px;height:30px;border-radius:10px 10px 10px 3px;background:var(--pri);display:grid;place-items:center;color:#fff;font:700 16px var(--disp);transform:rotate(-6deg);transition:transform .4s var(--ease)}
.logo:hover i{transform:rotate(6deg) scale(1.08)}
.grp{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s,transform .25s var(--ease)}
.nv:hover{background:var(--pri-t);color:var(--ink);transform:translateX(3px)}
.nv[aria-current=page]{background:var(--pri);color:#fff;box-shadow:0 8px 18px -8px var(--pri)}
.sfoot{margin-top:auto;padding:14px 6px 2px;border-top:1px solid var(--line);display:grid;gap:8px}
.who{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#1B1408;font:800 14px var(--disp);display:grid;place-items:center}
.who>div b{display:block;line-height:1.2}.who>div span{font-size:12px;color:var(--muted)}
.sfoot select{height:36px;font-size:13px;border-radius:10px;padding:0 8px}
.lnk{padding:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-align:left}.lnk:hover{color:var(--ink)}
.mtop{display:none;align-items:center;justify-content:space-between;padding:12px 16px}
.main{padding:20px clamp(18px,3.4vw,52px) 110px;max-width:1280px;width:100%}
.scrim{display:none}.app>div{min-width:0}
@media(max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);padding:10px;transform:translateX(-105%);transition:transform .35s var(--ease)}
  .side.open{transform:none}.side.open~.scrim{display:block;position:fixed;inset:0;background:#1F1A3366;z-index:15}
  .mtop{display:flex}.main{padding-top:6px}
}

/* ---------- cabeçalho de página ---------- */
.crumb{display:flex;gap:8px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted)}.crumb a:hover{color:var(--pri)}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin:14px 0 30px}
.ph h1{font:800 clamp(34px,5vw,64px)/.98 var(--disp);letter-spacing:-.035em;margin-top:8px}
.ph .acts{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,2.4vw,32px)}
.panel>h2,.ph2{font:800 22px var(--disp);letter-spacing:-.02em;margin-bottom:6px}
.panel>.sub{color:var(--muted);margin-bottom:16px;max-width:60ch}
.panel+.panel,.panel+.alert,.alert+.panel,.alert+.alert,.panel+.demo,.alert+.demo,.panel+#pavisos,#pavisos+.demo,.stage+.laudo,.alert+.stage,.alert+.g3,.alert+.g2,.alert+.tablewrap{margin-top:22px}
.stack>*,.g2>*,.g3>*{margin-top:0!important}
/* nomes longos: nada estoura o contêiner */
.g2>*,.g3>*,.stack>*,.fh>*,.laudo>*,.book>*{min-width:0}
td:first-child,td.mono,.kv dd,.kv dt,.ph h1,.fh h1,.fh h1 span,.panel h2,.led .t,.tl li,.alert,.ticket,.seg,.laudo p.s,.stg p,.crumb,.chp,dialog p,dialog h3,.card h1,.portal h1,.empty h3,.empty p,.uuid{overflow-wrap:anywhere}
.chp,.uuid{max-width:100%}
.seg{max-width:100%;border-radius:22px;line-height:1.15}
.who>div{min-width:0}.sfoot{grid-template-columns:minmax(0,1fr)}.sfoot>*{min-width:0}.sbox{overflow-x:hidden}.who>div b,.who>div span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:grid;gap:22px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:15px;font-weight:700;background:var(--surf);border:1.5px solid var(--line);transition:transform .25s var(--ease),box-shadow .25s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--ink)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 8px 20px -8px var(--pri)}.btn.pri:hover{box-shadow:0 12px 26px -8px var(--pri)}
.btn.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:transparent}.btn.crit:hover{background:var(--crit-t);border-color:var(--crit)}
.btn.crit.fill{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.why{color:var(--muted);font-size:13px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 8px;border-radius:99px;font:700 12px/1.6 var(--sans);white-space:nowrap}
.tag[data-k=ok]{background:var(--ok-t);color:var(--ok)}.tag[data-k=warn]{background:var(--warn-t);color:var(--warn)}.tag[data-k=crit]{background:var(--crit-t);color:var(--crit)}.tag[data-k=neu]{background:var(--neu-t);color:var(--neu)}.tag[data-k=pri]{background:var(--pri-t);color:var(--pri)}
.alert{border-radius:20px;padding:18px 22px;display:grid;gap:10px;justify-items:start;background:var(--crit-t);border:1px solid color-mix(in srgb,var(--crit) 25%,transparent)}
.alert strong{font:800 20px var(--disp);color:var(--crit)}
.alert[data-k=neu],.alert[data-k=info]{background:var(--pri-t);border-color:color-mix(in srgb,var(--pri) 20%,transparent)}.alert[data-k=info] strong,.alert[data-k=neu] strong{color:var(--pri)}
.alert[data-k=ok]{background:var(--ok-t);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}.alert[data-k=ok] strong{color:var(--ok)}
.alert[data-k=warn]{background:var(--warn-t);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}.alert[data-k=warn] strong{color:var(--warn)}
.empty{text-align:center;padding:48px 20px;display:grid;gap:10px;justify-items:center}
.empty .ob{width:88px;height:88px;border-radius:50% 50% 50% 14px;background:var(--acc-t);display:grid;place-items:center;color:var(--acc);margin-bottom:6px;transform:rotate(-6deg)}
.empty .ob svg{width:38px;height:38px}.empty h3{font:800 26px var(--disp);letter-spacing:-.02em}.empty p{color:var(--muted);max-width:44ch}
.uuid{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:var(--neu-t);color:var(--muted);font:500 12px var(--mono)}.uuid:hover{background:var(--pri-t);color:var(--pri)}
.tablewrap{overflow-x:auto;margin:0 -8px}
table{width:100%;border-collapse:collapse;min-width:620px}td .chips{max-width:360px}
th{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px}
td{padding:14px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}td.num,td .tag,td.mono{white-space:nowrap;overflow-wrap:normal}td:first-child{min-width:170px}
.acell{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:nowrap;white-space:nowrap}.acell .btn{flex:none}td.r:has(.acell){width:1%}
tr.link{cursor:pointer}tr.link:hover td{background:var(--pri-t)}tr.link td:first-child{border-radius:14px 0 0 14px}tr.link td:last-child{border-radius:0 14px 14px 0}
td b{font-weight:700}.cl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}td small{display:block;color:var(--muted)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-weight:700;font-size:14px}.field .h{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surf);padding:0 14px;transition:border-color .2s,box-shadow .2s}
textarea{padding:12px 14px;min-height:96px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-t)}
input[aria-invalid=true]{border-color:var(--crit)}.err{color:var(--crit);font-size:13px;font-weight:600}
.form{max-width:520px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px;max-width:380px}.search svg{position:absolute;left:14px;top:15px;color:var(--muted)}.search input{padding-left:40px}
.seg-ctl{display:inline-flex;flex-wrap:wrap;max-width:100%;gap:4px;padding:4px;border-radius:24px;background:var(--surf);border:1px solid var(--line)}
.seg-ctl button{padding:7px 14px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}.seg-ctl button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 22px}.kv dt{color:var(--muted)}.kv dd{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cc{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font:500 12px var(--mono);background:var(--neu-t);color:var(--muted)}
.cc[data-ok=true]{background:var(--ok-t);color:var(--ok)}.cc[data-ok=false]{background:var(--warn-t);color:var(--warn)}
.stat{display:grid;gap:2px}.stat b{font:800 clamp(44px,5vw,72px)/1 var(--disp);letter-spacing:-.04em}.stat span{color:var(--muted);font-size:14px}
.pips{display:flex;gap:4px;margin:8px 0 4px}.pips i{flex:1;height:10px;border-radius:5px;background:var(--line)}.pips i.on{background:var(--pri)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px}@media(max-width:700px){.tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:-4px;padding:0 4px 4px;scrollbar-width:none}.tabs a{white-space:nowrap}}
.tabs a{padding:10px 18px;border-radius:99px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}.tabs a:hover{background:var(--surf);color:var(--ink)}.tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}
.tl{list-style:none;padding:0;position:relative}.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line);border-radius:2px}
.tl li{position:relative;padding:6px 0 14px 38px}.tl li::before{content:"";position:absolute;left:5px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--surf);border:3px solid var(--pri)}
.tl li[data-t=Revogação]::before{border-color:var(--crit)}.tl li small{display:block;color:var(--muted)}
.skel{display:grid;gap:14px}.sk{height:18px;border-radius:9px;background:linear-gradient(90deg,var(--line) 30%,var(--surf) 50%,var(--line) 70%);background-size:300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.steps{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}.steps span{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted)}.steps b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--neu-t);font:700 13px var(--mono)}
.steps .on{color:var(--ink)}.steps .on b{background:var(--pri);color:#fff}.steps .dn b{background:var(--ok);color:#fff}
.sw{display:inline-flex;align-items:center;gap:10px;font-weight:600}.sw i{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);transition:background .3s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}.sw[aria-checked=true] i{background:var(--pri)}.sw[aria-checked=true] i::after{transform:translateX(20px)}

/* carimbo e régua (ficha) */
.stamp{--c:var(--ok);display:grid;gap:3px;justify-items:center;padding:12px 24px 10px;border:3px double var(--c);color:var(--c);border-radius:8px;transform:rotate(-4deg);filter:url(#rough);background:color-mix(in srgb,var(--c) 7%,transparent);user-select:none;width:max-content}
.stamp[data-k=neu]{--c:var(--neu);border-style:dashed;border-width:2px}.stamp[data-k=crit]{--c:var(--crit)}
.stamp small{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.stamp strong{font:700 clamp(24px,2.8vw,38px)/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.stamp[data-k=crit] strong{text-decoration:line-through;text-decoration-thickness:3px}
.stamp{margin:10px 10px 16px}.stamp.sm{padding:8px 16px 7px;margin:8px 8px 22px}.stamp.sm strong{font-size:22px}
.fh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:end;margin:14px 0 26px}
.fh h1{font:800 clamp(46px,8.4vw,128px)/.86 var(--disp);letter-spacing:-.04em;margin-top:14px;hyphens:auto}
.fh h1.lg{font-size:clamp(38px,6vw,92px);line-height:.92}.fh h1.lg span,.fh h1.xl span{display:inline}.fh h1.xl{font-size:clamp(32px,4.4vw,64px);line-height:.98;letter-spacing:-.03em}
.fh h1 span{display:block;color:var(--pri)}
.chp{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--surf);border:1px solid var(--line);color:var(--muted);font:500 12px var(--mono)}
.fh .meta{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:760px){.fh{grid-template-columns:1fr}}
.stage{background:var(--band);color:var(--band-ink);border-radius:36px;padding:clamp(20px,3vw,40px) clamp(18px,3vw,40px) 0;position:relative;overflow:hidden;margin-bottom:34px}
.stage::before,.stage::after{content:"";position:absolute;border-radius:50%;border:1.5px solid #ffffff2e;pointer-events:none}
.stage::before{width:520px;height:520px;right:-180px;top:-300px}.stage::after{width:280px;height:280px;left:34%;top:-190px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.stg{padding:0 14px 22px 16px;min-height:140px;--c:var(--band-mute);position:relative;border-radius:14px}
.stg+.stg::before{content:"";position:absolute;left:0;top:6px;bottom:28px;width:1px;background:#ffffff38}
.stg[data-s=done]{--c:var(--lit)}.stg[data-s=run]{--c:#fff}.stg[data-s=err]{--c:#FFD5D5}.stg[data-s=attn]{--c:#FFE08A}.stg[data-s=blk]{--c:#FFD5D5}
.stg .rw{display:flex;align-items:center;gap:8px;color:var(--c);font:500 12px var(--mono)}
.stg .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.stg[data-s=done] .dot{background:var(--c);color:var(--band)}.stg[data-s=run] svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stg h3{overflow-wrap:normal;hyphens:manual;font:800 clamp(18px,2vw,30px)/1.05 var(--disp);letter-spacing:-.02em;margin:12px 0 8px}
.stg p{color:var(--band-mute);font-size:13.5px;max-width:26ch;min-height:2.8em}
.rule{position:relative;height:68px;cursor:crosshair}
.ticks{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;justify-content:space-between;align-items:flex-end}
.ticks i{display:block;width:3px;border-radius:3px 3px 0 0;height:var(--h);background:#ffffff47;transition:background .15s,height .14s ease-out}
.ticks i[data-lit=true]{background:var(--lit)}.ticks i.M{--h:34px}.ticks i.m{--h:20px}.ticks i.u{--h:10px}
.needle{position:absolute;top:0;bottom:0;width:0;transition:left .75s linear,opacity .3s;pointer-events:none}
.needle::before{content:"";position:absolute;bottom:0;top:16px;width:3px;margin-left:-1.5px;background:#fff;border-radius:3px}
.needle span{position:absolute;top:0;transform:translateX(-50%);font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--band);padding:5px 9px;border-radius:99px}
.needle[data-hide=true]{opacity:0}
@media(max-width:900px){.stages{grid-template-columns:1fr 1fr}.stg:nth-child(3)::before{display:none}.stg{min-height:0}}
.laudo{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:24px clamp(28px,6vw,96px);align-items:start;margin-bottom:34px}
.laudo p.s{font:600 clamp(22px,2.6vw,36px)/1.22 var(--disp);letter-spacing:-.02em;max-width:26em;text-wrap:pretty}
.laudo mark{background:var(--acc-t);color:var(--ink);padding:0 .22em;border-radius:.25em;font-weight:800}.laudo mark[data-k=blk]{background:var(--crit-t);color:var(--crit)}
.laudo em{font-style:normal;color:var(--pri);font-weight:800}
.acts-col{display:grid;gap:10px}
@media(max-width:900px){.laudo{grid-template-columns:1fr}}
.seg{display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 8px;border-radius:99px;background:var(--acc);color:#1B1408;font:800 20px var(--disp)}.seg i{width:30px;height:30px;border-radius:50%;background:#ffffff80;display:grid;place-items:center}
.ticket{position:relative;background:var(--pri);color:#fff;border-radius:var(--r);padding:22px;overflow:visible}
.ticket::before,.ticket::after{content:"";position:absolute;top:56%;width:22px;height:22px;border-radius:50%;background:var(--surf)}.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ticket strong{display:block;font:800 26px/1.08 var(--disp);letter-spacing:-.02em;margin:8px 0 6px}.ticket hr{border:0;border-top:2px dashed #ffffff66;margin:18px -4px 12px}
.ticket .tag{background:#fff;color:var(--pri)}.ticket .btn{background:#fff;color:var(--pri);border-color:transparent}

/* ---------- entrar / portal ---------- */
.center{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
.card{width:min(460px,100%);background:var(--surf);border:1px solid var(--line);border-radius:34px;padding:clamp(24px,4vw,40px);box-shadow:0 30px 60px -30px #5B3DF540}
.card h1{font:800 34px/1.05 var(--disp);letter-spacing:-.03em;margin:18px 0 6px}.card .lead{color:var(--muted);margin-bottom:22px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);align-items:center}.quick small{width:100%;color:var(--muted)}
.portal{max-width:640px;margin:0 auto;padding:22px 20px 100px;position:relative;z-index:1}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.portal h1{font:800 clamp(38px,7vw,60px)/.98 var(--disp);letter-spacing:-.035em;margin-bottom:22px}
.demo{margin-top:22px;padding:14px 18px;border-radius:18px;border:1.5px dashed var(--line);color:var(--muted);font-size:14px;display:grid;gap:8px;justify-items:start}

/* ---------- diálogo e toast ---------- */
dialog{border:0;border-radius:30px;padding:28px;width:min(500px,92vw);background:var(--surf);color:var(--ink);box-shadow:0 30px 80px -20px #0007;margin:auto}
dialog::backdrop{background:#1F1A3373}
dialog h3{font:800 28px/1.1 var(--disp);letter-spacing:-.02em;margin-bottom:10px}dialog p.fx{color:var(--muted);margin-bottom:18px}
dialog .fa{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60;justify-items:end}
.toast{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;animation:tin .3s var(--ease);box-shadow:0 12px 30px -10px #0006}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.95)}}
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:70}
.page{animation:pin .35s var(--ease)}@keyframes pin{from{opacity:0;transform:translateY(8px)}}
@media(max-width:560px){.stamp{width:auto;max-width:calc(100% - 20px)}.stamp strong{font-size:clamp(20px,7vw,28px);white-space:normal;text-align:center}.stamp small{letter-spacing:.08em;text-align:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

function dl(name,text,type="text/plain"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

const P={ok:'<circle cx="8" cy="8" r="6"/><path d="M5.2 8.2l2 2 3.6-4"/>',check:'<path d="M3.6 8.4l3 3 5.8-6.6"/>',crit:'<circle cx="8" cy="8" r="6"/><path d="M3.8 12.2l8.4-8.4"/>',x:'<path d="M4 4l8 8M12 4l-8 8"/>',warn:'<path d="M8 2.2l6 10.6H2z"/><path d="M8 6.6v2.6M8 11h.01"/>',neu:'<circle cx="8" cy="8" r="6" stroke-dasharray="2 2"/>',pend:'<circle cx="8" cy="8" r="2"/>',run:'<path d="M8 2a6 6 0 1 1-6 6"/>',

out:'<path d="M6 2.500H3v11h3M10 5l3 3-3 3M13 8H6"/>',search:'<circle cx="7" cy="7" r="4.500"/><path d="M10.500 10.500L14 14"/>',plus:'<path d="M8 3v10M3 8h10"/>',dl:'<path d="M8 3v8M4.500 8L8 11.500 11.500 8M3 13.500h10"/>',menu:'<path d="M2.500 4.500h11M2.500 8h11M2.500 11.500h11"/>',copy:'<rect x="5" y="5" width="8" height="8" rx="1.500"/><path d="M3 10.500V3.500h7"/>',list:'<path d="M5.500 4.500h8M5.500 8h8M5.500 11.500h8M2.500 4.500h.01M2.500 8h.01M2.500 11.500h.01"/>',
doc:'<path d="M4 2h5.500L13 5.500V14H4zM9 2v4h4"/>',heart:'<path d="M8 13.500S2.500 10 2.500 6.200A2.900 2.900 0 0 1 8 5a2.900 2.900 0 0 1 5.500 1.200C13.500 10 8 13.500 8 13.500z"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${P[k]||""}</svg>`;
const tag=(k,t,i)=>`<span class="tag" data-k="${k}">${ic(i||{ok:"ok",warn:"warn",crit:"crit",neu:"neu",pri:"star"}[k])}${esc(t)}</span>`;
const CONS={CONCEDIDO:["ok","Concedido"],NAO_CONCEDIDO:["neu","Não concedido"],REVOGADO:["crit","Revogado"]};

/* ---------- dados sintéticos ---------- */
function rng(s){return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
const NOMES=["Marina Costa","Otávio Lima","Iara Nunes","Caetano Rocha","Lúcia Prado","Dante Alves","Yara Santos","Bento Moraes","Nina Duarte","Heitor Faria","Olívia Reis","Davi Teixeira","Aline Barros","Bruno Pires","Camila Freitas","Diego Azevedo","Elisa Monteiro","Fábio Cardoso","Gabriela Ramos","Hugo Neves","Isabela Cruz","João Mendes","Karina Lopes","Leandro Dias","Mônica Vidal","Nelson Aguiar"];
const CATS=["livros","games","moda","casa"];
const mkCons=(st,r,pub)=>{
  if(st==="NAO_CONCEDIDO")return{status:st,termo:null,desde:null,revogado:null,tl:[]};
  const desde=ago(20+Math.floor(r()*140)),tl=[{t:"Concessão",q:desde,por:"Rita (painel)",termo:"v1"}];
  if(st==="REVOGADO"){const rv=ago(pub?10:Math.floor(r()*30)+(pub?0:0));tl.unshift({t:"Revogação",q:rv,por:pub?"Rita (painel)":"titular (portal)",termo:"v1"});return{status:st,termo:"v1",desde,revogado:rv,tl}}
  return{status:st,termo:"v1",desde,revogado:null,tl};
};
function seed(){
  const r=rng(11);
  const catalogo=[["livros","Coleção de ficção, edição especial",189,true],["livros","Dom Casmurro",39.9,true],["livros","Memórias Póstumas",34.9,true],["games","Controle sem fio",249,true],["games","Jogo de aventura",179.9,true],["moda","Camisa de linho",129.9,true],["moda","Tênis urbano",299,true],["casa","Jogo de panelas",349,true],["casa","Luminária de mesa",119,false]].map(([cat,nome,preco,ativo],i)=>({id:"p-"+(i+1),cat,nome,preco,ativo}));
  const segs=[{id:"premium",nome:"Premium",prio:1,desc:"Clientes de ticket alto e compra frequente.",conds:[{c:"ticket",op:">=",v:150},{c:"compras",op:">=",v:3}],ativo:true},
    {id:"recorrente",nome:"Recorrente",prio:2,desc:"Compram com regularidade.",conds:[{c:"compras",op:">=",v:2}],ativo:true},
    {id:"explorador",nome:"Explorador",prio:3,desc:"Navegam e interagem muito, mas ainda não compraram.",conds:[{c:"engajamento",op:">=",v:4},{c:"compras",op:"=",v:0}],ativo:true},
    {id:"padrao",nome:"Padrão",prio:99,desc:"Quem não casa com nenhum outro segmento.",conds:[],ativo:true}];
  const S={catalogo,segs,termo:"v1",falha:false,users:[
    {u:"rita",nome:"Rita Andrade",papel:"Administrador",ativo:true},{u:"caio",nome:"Caio Mendes",papel:"Analista",ativo:true},{u:"bia",nome:"Bia Souza",papel:"Atendimento",ativo:true},{u:"leo",nome:"Leo Martins",papel:"Atendimento",ativo:false}],
    audit:[],outbox:[],tokens:{},hist:[],snap:{},session:null,portal:null,prazo:365,clients:[]};
  S.clients=NOMES.map((nome,i)=>{
    const st=i%9===3?"NAO_CONCEDIDO":i%11===5?"REVOGADO":"CONCEDIDO";
    const seg=mkCons(st,r,false),pst=st==="CONCEDIDO"?(r()<.6?"CONCEDIDO":i%7===0?"REVOGADO":"NAO_CONCEDIDO"):"NAO_CONCEDIDO";
    const c={id:"c-"+String(i+1).padStart(3,"0"),nome,email:norm(nome.split(" ")[0])+"@exemplo.test",cadastro:ago(70+Math.floor(r()*220)),ativo:i!==14,eliminado:false,cons:{seg,pub:mkCons(pst,r,true)},events:[],proc:null,fail:null,pedido:null};
    if(st!=="NAO_CONCEDIDO"){const n=3+Math.floor(r()*9);for(let k=0;k<n;k++){const x=r(),t=x<.4?"nav":x<.7?"buy":"int";c.events.push({t,cat:r()<.6?CATS[i%4]:CATS[Math.floor(r()*4)],v:t==="buy"?Math.round(30+r()*(i%3===0?420:200)):0,q:ago(r()*28),origem:"site"})}c.events.sort((a,b)=>b.q.localeCompare(a.q))}
    return c;
  });
  S.clients.forEach((c,i)=>{if(c.cons.seg.status==="CONCEDIDO"&&c.events.length){const old=[1,6,9].includes(i);runProc(S,c,ago(old?40:1+Math.floor(r()*6)));if(i%2===0)c.proc.recStatus="ATIVA"}});
  S.clients[11].cons.seg=mkCons("CONCEDIDO",r,false);
  const rv=S.clients.find(c=>c.cons.seg.status==="REVOGADO");if(rv){rv.cons.seg.revogado=ago(400);rv.cons.seg.tl[0].q=ago(400)}
  const pc=S.clients[2];pc.pedido=ago(2);S.outbox.push({para:"marina@exemplo.test",assunto:"Seu link de acesso ao Perfila",q:ago(.02),txt:"Abra este link para entrar: #/titular/acesso?t=demo"});
  S.audit.push({q:ago(.1),op:"rita",acao:"Entrou",det:"Sessão iniciada"});
  return S;
}
/* ---------- regras de domínio (simuladas) ---------- */
const cmp=(a,op,b)=>op===">="?a>=b:op==="<="?a<=b:a===b;
const val=(p,c)=>c==="compras"?p.compras:c==="ticket"?p.ticket:p.eng;
const casa=(cs,p)=>cs.every(x=>cmp(val(p,x.c),x.op,Number(x.v)));
const CAMPO={compras:"compras",ticket:"ticket médio",engajamento:"engajamento"};
const fmtV=(c,v)=>c==="ticket"?brl(v):String(v);
const condTxt=x=>`${CAMPO[x.c]} ${x.op} ${fmtV(x.c,x.v)}`;
function perfil(c){const ev=c.events,b=ev.filter(e=>e.t==="buy"),cnt={};ev.forEach(e=>{if(e.cat)cnt[e.cat]=(cnt[e.cat]||0)+1});
  const total=b.reduce((a,e)=>a+e.v,0);
  return{n:ev.length,nav:ev.filter(e=>e.t==="nav").length,int:ev.filter(e=>e.t==="int").length,compras:b.length,total,ticket:b.length?total/b.length:0,cat:Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b))[0]||null,eng:ev.filter(e=>new Date(e.q).getTime()>NOW-30*DAY).length}}
const segDe=(S,p,segs=S.segs)=>segs.filter(s=>s.ativo).sort((a,b)=>a.prio-b.prio).find(s=>casa(s.conds,p))||null;
function recomendar(S,seg,p){if(!p.cat)return{sem:null};const pr=S.catalogo.filter(x=>x.ativo&&x.cat===p.cat).sort((a,b)=>a.nome.localeCompare(b.nome))[0];return pr?{nome:pr.nome,preco:pr.preco,motivo:`Segmento ${seg.nome.toLowerCase()}, categoria ${p.cat}`}:{sem:p.cat}}
function runProc(S,c,when=new Date().toISOString()){const p=perfil(c),seg=segDe(S,p);c.proc={when,p,segId:seg.id,segNome:seg.nome,rec:recomendar(S,seg,p),recStatus:"GERADA",validade:new Date(new Date(when).getTime()+30*DAY).toISOString()};c.fail=null}
const stale=c=>c.proc&&c.events.length>c.proc.p.n;
const eligible=c=>c.ativo&&!c.eliminado&&c.cons.seg.status==="CONCEDIDO";

let S=seed();
const log=(acao,det)=>S.audit.unshift({q:new Date().toISOString(),op:S.session?.u||"—",acao,det});
const cli=id=>S.clients.find(c=>c.id===id);

 ["Análise","analise",[["Relatórios","#/relatorios","chart"]]],["Campanhas","campanhas",[["Públicos","#/publicos","mega"],["Relatório agregado","#/publicos/relatorio","chart"]]],

const uuid=id=>`<button class="uuid" data-act="copy" data-v="${id}" title="Copiar ID">${id}${ic("copy")}</button>`;
const alertH=(k,t,body="",extra="")=>`<div class="alert" data-k="${k}" role="${k==="crit"?"alert":"status"}"><strong>${t}</strong>${body?`<span>${body}</span>`:""}${extra}</div>`;

const ph=(crumb,title,acts="")=>`<div class="crumb">${crumb.map(([t,h])=>h?`<a href="${h}">${t}</a>`:`<span>${t}</span>`).join("<span>›</span>")}</div>${title?`<div class="ph"><h1>${title}</h1><div class="acts">${acts}</div></div>`:'<div style="height:6px"></div>'}`;

function stampH(st,when,label="Consentimento · termo v1",sm=""){const[k,t]=st==="ELIMINADO"?["neu","Eliminado"]:CONS[st];return`<div class="stamp ${sm}" data-k="${k}" role="status"><small>${label}</small><strong>${t}</strong><small>${when||"nenhum registro"}</small></div>`}
function confetti(sel){const el=$(sel);if(!el||reduce)return;const r=el.getBoundingClientRect(),cs=getComputedStyle(document.documentElement),cols=["--pri","--acc","--ok","--lit"].map(v=>cs.getPropertyValue(v).trim());
  for(let i=0;i<22;i++){const s=document.createElement("i");s.className="spark";s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${cols[i%4]}`;document.body.append(s);const a=Math.random()*6.28,d=70+Math.random()*130;
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*400,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>s.remove()}}
/* diálogo genérico */
function dlg({title,body="",fx="",ok="Confirmar",kind="pri",cancel="Cancelar",onOk,focusCancel=true,single=false}){
  const d=$("#dlg");d.innerHTML=`<h3>${title}</h3>${fx?`<p class="fx">${fx}</p>`:""}<form id="dlgf" novalidate>${body}<div class="fa">${single?"":`<button type="button" class="btn" data-d="no" ${focusCancel?"autofocus":""}>${cancel}</button>`}<button type="submit" class="btn ${kind==="crit"?"crit fill":"pri"}">${ok}</button></div></form>`;
  d.onclose=null;if(!d.open)d.showModal();
  $("#dlgf").onsubmit=e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));if(onOk&&onOk(fd)===false)return;d.close()};
  $("[data-d=no]",d)?.addEventListener("click",()=>d.close());
}
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
const field=(id,label,val="",o={})=>`<div class="field"><label for="${id}">${label}</label>${o.type==="select"?`<select id="${id}" name="${id}">${o.opts.map(x=>`<option ${x===val?"selected":""}>${x}</option>`).join("")}</select>`:`<input id="${id}" name="${id}" type="${o.type||"text"}" value="${esc(val)}" ${o.ro?"readonly":""} ${o.ph?`placeholder="${o.ph}"`:""} ${o.step?`step="${o.step}"`:""} ${o.req?"required":""} ${o.ac?`autocomplete="${o.ac}"`:""}>`}${o.h?`<span class="h">${o.h}</span>`:""}<span class="err" id="${id}-e"></span></div>`;
const setErr=(id,m)=>{const e=$("#"+id+"-e");if(e)e.textContent=m;const i=$("#"+id);if(i)i.setAttribute("aria-invalid",m?"true":"false")};

/* ---------- régua de processamento ---------- */
const STEPS=["Coletar eventos","Gerar perfil","Segmentar","Recomendar"];
let RUN=null;
function stageInfo(c){
  const consent=c.cons.seg.status==="CONCEDIDO";
  return STEPS.map((n,i)=>{
    if(!consent)return["blk","Bloqueada sem consentimento"];
    if(RUN&&RUN.id===c.id){if(RUN.i===i)return["run","Em andamento…"];if(i<RUN.i)return["done","Concluída"];return["pend","Aguardando"]}
    if(c.fail){if(i<c.fail.i)return["done",["Eventos lidos","Perfil atualizado"][i]];if(i===c.fail.i)return["err","Falha de configuração dos segmentos"];return["pend","Não executada"]}

function conferir(text){
  const ls=text.replace(/\r/g,"").split("\n").filter(x=>x.trim());
  if(!ls.length)return{err:"Arquivo vazio. Use o modelo e preencha ao menos uma linha."};
  if(ls.length>1001)return{err:"Arquivo com mais de 1.000 linhas. Divida em arquivos menores."};
  if(ls[0].trim()!==CSVH)return{err:`Cabeçalho incorreto. Use exatamente: ${CSVH}`};
  const rows=ls.slice(1).map((l,i)=>{const[id,tp,v,cat,origem,q]=l.split(",").map(x=>x.trim());const o={linha:i+2,id,tp,v,cat,origem,q,st:"ok",motivo:""};const c=cli(id);
    if(!c)return{...o,st:"err",motivo:"Cliente não encontrado."};
    if(c.cons.seg.status!=="CONCEDIDO")return{...o,st:"err",motivo:"Sem consentimento válido."};
    if(!["compra","navegacao","interacao"].includes(tp))return{...o,st:"err",motivo:"Tipo inválido. Use compra, navegacao ou interacao."};
    if(tp==="compra"&&!(+v>0))return{...o,st:"err",motivo:"Compra precisa de valor maior que zero, com ponto decimal."};
    if(isNaN(new Date(q)))return{...o,st:"err",motivo:"Data inválida. Use o formato ISO com fuso."};
    const t={compra:"buy",navegacao:"nav",interacao:"int"}[tp];
    if(c.events.some(e=>e.t===t&&e.q===new Date(q).toISOString()&&(e.v||0)===(+v||0)))return{...o,st:"dup",motivo:"Evento já importado."};
    return{...o,t};});
  return{rows};
}

   MOLDURA, ENTRAR E ROTEADOR

function shell(page){
  const cur=CUR.split("?")[0],hrefs=NAV.flatMap(g=>g[2].map(i=>i[1])),best=hrefs.filter(h=>cur===h||cur.startsWith(h+"/")).sort((a,b)=>b.length-a.length)[0];
  const nav=NAV.filter(([,g])=>can(g)).map(([t,g,items])=>`<div class="grp">${t}</div>${items.filter(i=>!i[3]||can(i[3])).map(([n,h,ico])=>`<a class="nv" href="${h}" ${h===best?'aria-current="page"':""}>${ic(ico)}${n}</a>`).join("")}`).join("");
  return`<div class="app"><aside class="side" id="side"><div class="sbox"><div class="logo"><i>p</i>perfila</div><nav aria-label="Principal">${nav}</nav>
  <div class="sfoot"><div class="who"><span class="av">${S.session.nome[0]}</span><div><b>${esc(S.session.nome)}</b><span>${S.session.papel}</span></div></div>
  <a class="lnk" href="#/minha-senha">Minha senha</a><button class="lnk" data-act="sair">Sair</button></div></div></aside><div class="scrim" data-act="menu"></div>
  <div><div class="mtop"><div class="logo" style="padding:0"><i>p</i>perfila</div><button class="btn sm" data-act="menu">${ic("menu")}Menu</button></div><main class="main" id="main"><div class="page" id="pg">${page.html}</div></main></div></div>`;
}
function entrar(msg=""){
  return`<div class="center"><div class="card"><div class="logo" style="padding:0"><i>p</i>perfila</div><h1>Entrar</h1><p class="lead">Painel de operação: cadastro, consentimento LGPD e processamento de clientes.</p>${msg?alertH(msg.k,msg.t)+'<div style="height:16px"></div>':""}<form id="flogin" novalidate>${field("lu","Usuário","rita",{ac:"username"})}${field("ls","Senha","demonstracao",{type:"password",ac:"current-password"})}<button class="btn pri" style="width:100%">Entrar</button></form><p class="why" style="margin-top:20px">Acesso restrito à equipe de operação. As ações ficam registradas com o seu usuário.</p></div></div>`;
}
const FIRST={Administrador:"#/clientes",Analista:"#/relatorios",Atendimento:"#/clientes"};
function parse(){
  const h=CUR.slice(1)||"/",[path,qs]=h.split("?"),q=Object.fromEntries(new URLSearchParams(qs||""));
  return{parts:path.split("/").filter(Boolean),q};
}
let lastPath="";
let CUR=location.hash||"#/";
function nav(h){if(h===CUR){route("nav");return}CUR=h;try{history.pushState(null,"",h)}catch(_){}route("nav")}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#/"]');if(a&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey){e.preventDefault();nav(a.getAttribute("href"))}});
addEventListener("popstate",()=>{CUR=location.hash||"#/";DLG_CLOSE();route("nav")});
function route(skel){
  const{parts,q}=parse();
  if(parts[0]==="titular")return portal(parts,q);
  if(!S.session){$("#root").innerHTML=entrar(S.expirou?{k:"warn",t:"Sua sessão expirou. Entre de novo para continuar."}:"");return}
  if(!parts.length||parts[0]==="entrar"){nav(FIRST[S.session.papel]);return}
  let pg,[a,b,c]=parts;
  if(a==="clientes"){pg=!b?pgClientes(q):b==="novo"?pgNovo():pgFicha(b,c||"visao")}
  else if(a==="eventos"&&b==="importar")pg=pgImportar();
  else if(a==="pedidos")pg=pgPedidos();
  else if(a==="relatorios")pg=pgRelatorios();
  else if(a==="publicos")pg=b==="relatorio"?pgPubRel():pgPublicos(q);
  else if(a==="segmentos")pg=!b?pgSegmentos():b==="previa"?pgPrevia():pgSegForm(b);
  else if(a==="catalogo")pg=!b?pgCatalogo():pgProdForm(b);
  else if(a==="operacao")pg=b==="caixa-saida"?pgCaixa():pgOperacao();
  else if(a==="usuarios")pg=pgUsuarios();
  else if(a==="auditoria")pg=pgAuditoria(q);
  else if(a==="minha-senha")pg=pgSenha();
  else pg={html:emptyH("Página não encontrada","O endereço não existe.",`<a class="btn" href="#/">Ir ao início</a>`,"search"),perm:"*"};
  if(pg.perm!=="*"&&!can(pg.perm))pg={html:ph([["Sem permissão"]],"Sem permissão")+emptyH("Seu papel não abre esta área","Troque de papel no rodapé do menu para ver o que cada um acessa.",`<a class="btn" href="${FIRST[S.session.papel]}">Ir ao início</a>`,"shield")};
  const open=$("#side")?.classList.contains("open"),sc=scrollY;
  const full=!$("#pg")||skel;
  if(full){$("#root").innerHTML=shell(pg);if(skel==="nav"&&lastPath.split("?")[0]!==CUR.split("?")[0]&&!reduce&&/^(clientes|relatorios|segmentos|catalogo|publicos|usuarios|auditoria)$/.test(a)&&!c&&b!=="novo"){/* esqueleto breve */const box=$("#pg");const html=pg.html;box.innerHTML=`<div class="skel" style="margin-top:60px"><div class="sk" style="width:30%;height:44px"></div><div class="sk" style="height:220px;border-radius:24px"></div><div class="sk" style="width:70%"></div></div>`;setTimeout(()=>{if($("#pg")===box)box.innerHTML=html},170)}}
  else{$("#pg").innerHTML=pg.html;$$(".nv").forEach(n=>n.removeAttribute("aria-current"))}
  if(!full)scrollTo(0,sc);
  if(skel==="nav"&&lastPath.split("?")[0]!==CUR.split("?")[0])scrollTo(0,0);
  lastPath=CUR;
}
const draw=()=>{const sc=scrollY;const{parts,q}=parse();const html=$("#pg");if(!html||parts[0]==="titular"){route(true);return}route(true);scrollTo(0,sc)};

function DLG_CLOSE(){const d=$("#dlg");if(d.open)d.close()}

/* =============================================================
   PORTAL DO TITULAR
   ============================================================= */
function portal(parts,q){
  const b=parts[1]||"entrar";let body="";
  const top=`<div class="ptop"><div class="logo" style="padding:0"><i>p</i>perfila</div>${S.portal?`<button class="lnk" data-act="psair">Sair</button>`:`<a class="lnk" href="#/">Painel da equipe</a>`}</div>`;
  const c=S.portal&&cli(S.portal);
  if(b==="entrar")body=`<h1>Acesse seus dados</h1><div class="panel"><form id="fpe" novalidate>${field("pe","E-mail","",{type:"email",ph:"voce@exemplo.test",h:"Dica da demonstração: marina@exemplo.test"})}<button class="btn pri">Enviar link de acesso</button></form></div>${S.lastTok?`<div id="pavisos">${alertH("info","Link enviado","Se o e-mail estiver cadastrado, enviamos um link de acesso. Ele vale por 30 minutos e só pode ser usado uma vez.")}</div><div class="demo"><span>Demonstração: a equipe veria esta mensagem na Caixa de saída. Na vida real, você abriria o e-mail.</span><a class="btn sm" href="#/titular/acesso?t=${S.lastTok}">Abrir o link recebido</a></div>`:""}`;
  else if(b==="acesso"){const t=S.tokens[q.t];
    body=t&&!t.used&&t.exp>Date.now()?`<h1>Pronto para entrar</h1><div class="panel"><p class="sub">Confirme para abrir seus dados.</p><button class="btn pri" data-act="pentrar" data-t="${q.t}">Entrar no portal</button></div>`:`<h1>Link inválido</h1>${alertH("crit","Este link não vale mais.","Peça um novo.",`<a class="btn pri sm" href="#/titular/entrar">Pedir novo link</a>`)}`}
  else if(!c||c.eliminado){body=`<h1>Sessão encerrada</h1>${alertH("neu","Entre de novo","Peça um novo link de acesso.",`<a class="btn pri sm" href="#/titular/entrar">Pedir link</a>`)}`}
  else if(b==="meus-dados"){
    const k=c.cons.seg,ok=k.status==="CONCEDIDO";
    body=`<h1>Olá, ${esc(c.nome.split(" ")[0])}</h1><div class="stack"><section class="panel"><h2>Seus dados de cadastro</h2>${kv([["Nome",esc(c.nome)],["E-mail",esc(c.email)],["Cadastro",fmtD(c.cadastro)]])}</section>
    <section class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Sua autorização</h2><p class="sub">Segmentação: entender seu comportamento de compra para recomendar produtos.</p></div>${stampH(k.status,ok?fmt(k.desde):k.status==="REVOGADO"?fmt(k.revogado):"","Autorização","sm")}</div>${kv([["Termo",k.termo||"—"],["Autorizada em",k.desde?fmt(k.desde):"—"],["Retirada em",k.revogado?fmt(k.revogado):"—"]])}<div style="margin:16px 0">${ok?`<button class="btn crit" data-act="pretirar">Retirar autorização</button>`:`<button class="btn pri" data-act="pautorizar">Autorizar de novo</button>`}</div><h3 class="ph2" style="font-size:17px">Histórico</h3>${tlH(k.tl)}</section>
    <section class="panel"><h2>Seus direitos</h2><div class="stack" style="gap:12px;margin-top:10px"><button class="btn" data-act="baixar" data-id="${c.id}">${ic("dl")}Baixar meus dados (JSON)</button>${c.pedido?alertH("info",`Você pediu a eliminação em ${fmt(c.pedido)}.`,"A equipe vai atender o pedido."):ok?alertH("warn","Para pedir a eliminação, retire a autorização antes."):`<button class="btn crit" data-act="peliminar">Pedir eliminação</button>`}</div></section></div>`}
  else body=emptyH("Página não encontrada","","","search");
  $("#root").innerHTML=`<div class="portal page">${top}${body}</div>`;
}

function conceder(id,f){const c=cli(id);
  dlg({title:"Conceder consentimento",fx:`A partir de agora, ${f==="seg"?"os eventos deste cliente podem ser usados para perfil, segmento e recomendação":"este cliente pode entrar nos públicos enviados a plataformas de anúncio"}.`,body:field("df","Finalidade",f==="seg"?"segmentacao":"publicidade_terceiros",{ro:true})+field("dt","Versão do termo",S.termo,{type:"select",opts:["v1","v2"]}),ok:"Conceder",focusCancel:false,onOk:fd=>{
    const k=c.cons[f],q=new Date().toISOString();k.status="CONCEDIDO";k.termo=fd.dt;k.desde=q;k.revogado=null;k.tl.unshift({t:"Concessão",q,por:S.session.nome.split(" ")[0]+" (painel)",termo:fd.dt});log("Consentimento concedido",`${c.id} · ${f}`);draw();toast("Consentimento concedido");pulse(".stamp");}});}
function revogar(id,f){const c=cli(id);
  dlg({title:"Revogar consentimento?",fx:"O processamento dos dados deste cliente para imediatamente. Os dados já registrados continuam guardados. Você pode conceder de novo depois.",ok:"Revogar consentimento",kind:"crit",onOk:()=>{const k=c.cons[f],q=new Date().toISOString();k.status="REVOGADO";k.revogado=q;k.tl.unshift({t:"Revogação",q,por:S.session.nome.split(" ")[0]+" (painel)",termo:k.termo});log("Consentimento revogado",`${c.id} · ${f}`);draw();toast("Consentimento revogado");}});}
async function processar(id){
  const c=cli(id);if(RUN)return;RUN={id,i:0};draw();
  const fail=S.falha;
  for(let i=0;i<4;i++){
    RUN.i=i;paintStage(c);$("#laudo")&&($("#laudo").innerHTML=`Processando os ${c.events.length} eventos de ${esc(c.nome.split(" ")[0])}, na ordem do fluxo…`);await wait(750);
    if(fail&&i===2){RUN=null;c.fail={i:2,code:"4f2a"+Math.floor(1000+Math.random()*8999).toString(16)};c.proc=c.proc;log("Processamento com falha",c.id);draw();toast("Falha na segmentação");return}
  }
  RUN=null;runProc(S,c);log("Processamento concluído",c.id);draw();confetti("#ticket");pulse("#ticket");toast("Processamento concluído");
}
function eliminar(id){const c=cli(id);
  dlg({title:"Eliminar dados?",fx:`Esta ação anonimiza o cadastro e apaga eventos, perfil e recomendação de ${c.nome}. O histórico do consentimento permanece como prova. Não há como desfazer.`,body:field("dn",`Digite o nome do cliente para confirmar`,"",{h:c.nome}),ok:"Eliminar dados",kind:"crit",onOk:fd=>{if(fd.dn.trim()!==c.nome){setErr("dn","O nome digitado é diferente do nome do cliente.");return false}
    elim(c);log("Dados eliminados",c.id);nav("#/clientes/"+c.id);draw();toast("Dados eliminados");}});}
function elim(c){c.nome="Titular eliminado";c.email="";c.events=[];c.proc=null;c.fail=null;c.eliminado=true;c.eliminadoEm=new Date().toISOString();c.ativo=false}
function dados(c){return JSON.stringify({id:c.id,nome:c.nome,email:c.email,cadastro:c.cadastro,consentimentos:c.cons,eventos:c.events,perfil:c.proc?.p||null,segmento:c.proc?.segNome||null,recomendacao:c.proc?.rec||null},null,2)}

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go&&!e.target.closest("button,a")){nav(go.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
  switch(a){
    case"copy":navigator.clipboard?.writeText(d.v).catch(()=>{});toast("ID copiado");break;
    case"menu":$("#side").classList.toggle("open");break;
    case"sair":S.session=null;S.expirou=false;nav("#/");route(true);break;
    case"reset":S=seed();DRAFT=null;IMP={step:1,rows:[],err:null,res:null};S.session=null;nav("#/");route(true);toast("Demonstração reiniciada");break;
    case"entrarcomo":{const u=S.users.find(x=>x.u===d.u);S.session=u;log("Entrou","Sessão iniciada");nav(FIRST[u.papel]);route(true);break}
    case"filtro":{const{q}=parse();nav(`#/clientes?c=${encodeURIComponent(d.v)}&q=${encodeURIComponent(q.q||"")}`);break}
    case"limpar":nav("#/clientes");break;
    case"conceder":conceder(d.id,d.f);break;
    case"revogar":revogar(d.id,d.f);break;
    case"processar":processar(d.id);break;
    case"ativar":{const c=cli(d.id);c.proc.recStatus="ATIVA";log("Recomendação ativada",c.id);draw();confetti("#ticket");toast("Recomendação ativada");break}
    case"baixar":{const c=cli(d.id);dl(`perfila-dados-${c.id}.json`,dados(c),"application/json");toast("Arquivo baixado");break}
    case"eliminar":eliminar(d.id);break;
    case"exemplo":IMP.text=csvExemplo();{const r=conferir(IMP.text);r.err?IMP.err=r.err:(IMP.rows=r.rows,IMP.step=2,IMP.err=null)}draw();break;
    case"conferir":{const f=$("#arq").files[0];if(!f){IMP.err="Nenhum arquivo escolhido. Escolha um .csv ou use o arquivo de exemplo.";draw();break}if(f.size>262144){IMP.err="Arquivo maior que 256 KiB.";draw();break}f.text().then(t=>{const r=conferir(t);r.err?IMP.err=r.err:(IMP.rows=r.rows,IMP.step=2,IMP.err=null);draw()});break}
    case"modelo":dl("modelo.csv",CSVH+"\nc-001,compra,89.90,livros,site,"+new Date().toISOString()+"\n","text/csv");break;
    case"importar":{IMP.rows.filter(r=>r.st==="ok").forEach(r=>cli(r.id).events.unshift({t:r.t,cat:r.cat,v:+r.v||0,q:new Date(r.q).toISOString(),origem:r.origem||"importação"}));IMP.rows=IMP.rows.map(r=>r.st==="ok"?{...r,st:"ok"}:r);IMP.step=3;log("Eventos importados",`${IMP.rows.filter(r=>r.st==="ok").length} eventos`);draw();toast("Importação concluída");break}
    case"novoarq":IMP={step:1,rows:[],err:null,res:null};draw();break;
    case"csv":{const g=grupos();dl("relatorio.csv","segmento,clientes,ticket_medio,categoria\n"+g.map(x=>x.n<5?`${x.s.nome},menos de 5,,`:`${x.s.nome},${x.n},${x.tk.toFixed(2)},${x.cat}`).join("\n"),"text/csv");break}
    case"gerar":{const en=entram(d.s);dlg({title:"Gerar arquivo do público?",fx:`O arquivo leva ${en.length} clientes, só com o e-mail em hash (SHA-256). Fica disponível por 7 dias.`,ok:"Gerar arquivo",focusCancel:false,onOk:()=>{const h=hex64(en.map(c=>c.email).join()+Date.now());S.hist.unshift({sid:d.s,q:new Date().toISOString(),tipo:"Inclusão",op:S.session.u,n:en.length,hash:h,ate:ahead(7),lines:en.map(c=>hex64(c.email))});S.snap[d.s]=en.map(c=>c.id);log("Público gerado",`${d.s} · ${en.length}`);draw();toast(`Arquivo gerado com ${en.length} clientes`)}});break}
    case"gerarrem":{const snap=S.snap[d.s]||[],rem=snap.filter(id=>!entram(d.s).some(c=>c.id===id));S.hist.unshift({sid:d.s,q:new Date().toISOString(),tipo:"Remoção",op:S.session.u,n:rem.length,hash:hex64("rem"+Date.now()),ate:ahead(7),lines:rem.map(id=>hex64(cli(id).email))});S.snap[d.s]=snap.filter(id=>!rem.includes(id));log("Remoção gerada",`${d.s} · ${rem.length}`);draw();toast("Arquivo de remoção gerado");break}
    case"baixarh":{const h=S.hist[+d.i];dl(`publico-${h.sid}-${h.tipo}.txt`,h.lines.join("\n"));break}
    case"toggleseg":{const s=S.segs.find(x=>x.id===d.id);DRAFT={src:"t",id:s.id,nome:s.nome,mode:"toggle"};nav("#/segmentos/previa");break}
    case"addcond":syncDraft();DRAFT.conds.push({c:"compras",op:">=",v:1});draw();break;
    case"rmcond":syncDraft();DRAFT.conds.splice(+d.i,1);draw();break;
    case"testar":{syncDraft();const p={compras:+$("#tc").value,ticket:+String($("#tt").value).replace(",","."),eng:+$("#te").value};const ok=casa(DRAFT.conds.map(x=>({...x,v:Number(String(x.v).replace(",","."))})),p);$("#tres").innerHTML=ok?tag("ok","O critério casa"):tag("warn","O critério não casa");break}
    case"salvarseg":{const D=DRAFT;if(D.mode==="toggle"){const s=S.segs.find(x=>x.id===D.id);s.ativo=!s.ativo;log(s.ativo?"Segmento ativado":"Segmento desativado",s.id)}else{const o={nome:D.nome,prio:+D.prio,desc:D.desc,conds:D.conds.map(x=>({...x,v:Number(String(x.v).replace(",","."))}))};if(D.id)Object.assign(S.segs.find(x=>x.id===D.id),o);else S.segs.push({id:norm(D.nome).replace(/\W+/g,"-"),ativo:true,...o});log("Segmento salvo",D.nome)}DRAFT=null;nav("#/segmentos");toast("Segmento salvo");break}
    case"toggleprod":{const p=S.catalogo.find(x=>x.id===d.id);dlg({title:p.ativo?"Desativar produto?":"Ativar produto?",fx:p.ativo?`${p.nome} deixa de ser recomendado. Quem já tem esta recomendação continua com ela até expirar.`:`${p.nome} volta a poder ser recomendado.`,ok:p.ativo?"Desativar":"Ativar",kind:p.ativo?"crit":"pri",onOk:()=>{p.ativo=!p.ativo;log(p.ativo?"Produto ativado":"Produto desativado",p.nome);draw();toast(p.ativo?"Produto ativado":"Produto desativado")}});break}
    case"expirar":dlg({title:"Expirar recomendações vencidas?",fx:"Recomendações ativas com validade vencida passam a Expirada.",ok:"Expirar agora",focusCancel:false,onOk:()=>{let n=0;S.clients.forEach(c=>{if(c.proc&&c.proc.recStatus==="ATIVA"&&new Date(c.proc.validade)<NOW){c.proc.recStatus="EXPIRADA";n++}});log("Recomendações expiradas",String(n));toast(n?`${n} recomendações expiradas`:"Nenhuma recomendação vencida")}});break;
    case"reter":dlg({title:"Aplicar retenção?",fx:`Titulares que revogaram há mais de ${S.prazo} dias têm os dados eliminados. Não há como desfazer.`,ok:"Aplicar retenção",kind:"crit",onOk:()=>{let n=0;S.clients.forEach(c=>{if(!c.eliminado&&c.cons.seg.status==="REVOGADO"&&NOW-new Date(c.cons.seg.revogado)>S.prazo*DAY){elim(c);n++}});log("Retenção aplicada",String(n));toast(n?`Retenção aplicada a ${n} clientes`:"Nenhum cliente com a retenção vencida")}});break;
    case"falha":S.falha=!S.falha;draw();toast(S.falha?"Falha simulada ligada":"Falha simulada desligada");break;
    case"novouser":dlg({title:"Novo operador",body:field("un","Nome")+field("uu","Usuário")+field("up","Papel","Atendimento",{type:"select",opts:Object.keys(PERM)}),ok:"Criar operador",focusCancel:false,onOk:fd=>{if(!fd.un||!fd.uu)return false;S.users.push({u:fd.uu,nome:fd.un,papel:fd.up,ativo:true});log("Operador criado",fd.uu);draw();toast("Operador criado")}});break;
    case"toggleuser":{const u=S.users.find(x=>x.u===d.u);u.ativo=!u.ativo;log(u.ativo?"Operador ativado":"Operador desativado",u.u);draw();break}
    case"senhaprov":toast("Senha provisória gerada: troque no primeiro acesso");log("Senha redefinida",d.u);break;
    /* portal */
    case"pentrar":{const t=S.tokens[d.t];t.used=true;S.portal=t.id;nav("#/titular/meus-dados");break}
    case"psair":S.portal=null;nav("#/titular/entrar");break;
    case"pretirar":dlg({title:"Retirar autorização?",fx:"A Perfila para de usar seus dados para recomendar produtos, agora. Você pode autorizar de novo quando quiser.",ok:"Retirar autorização",kind:"crit",onOk:()=>{const c=cli(S.portal),k=c.cons.seg,q=new Date().toISOString();k.status="REVOGADO";k.revogado=q;k.tl.unshift({t:"Revogação",q,por:"você, no portal",termo:k.termo});log("Revogação pelo portal",c.id);route(true);toast("Autorização retirada")}});break;
    case"pautorizar":dlg({title:"Autorizar de novo?",fx:`Você autoriza o uso dos seus dados para segmentação, com o termo vigente (${S.termo}).`,ok:"Autorizar",focusCancel:false,onOk:()=>{const c=cli(S.portal),k=c.cons.seg,q=new Date().toISOString();k.status="CONCEDIDO";k.termo=S.termo;k.desde=q;k.revogado=null;k.tl.unshift({t:"Concessão",q,por:"você, no portal",termo:S.termo});log("Concessão pelo portal",c.id);route(true);toast("Autorização registrada")}});break;
    case"peliminar":dlg({title:"Pedir eliminação?",fx:"Você pede que seus dados sejam eliminados. A equipe vai atender o pedido e você não poderá autorizar de novo antes disso.",ok:"Pedir eliminação",kind:"crit",onOk:()=>{const c=cli(S.portal);c.pedido=new Date().toISOString();log("Pedido de eliminação",c.id);route(true);toast("Pedido enviado")}});break;
  }
});
function syncDraft(){if(!DRAFT||!$("#fseg"))return;DRAFT.nome=$("#sn").value;DRAFT.prio=$("#sp").value;DRAFT.desc=$("#sd").value;$$("[data-cond]").forEach(el=>{DRAFT.conds[+el.dataset.i][el.dataset.cond]=el.value})}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="psel"){nav("#/publicos?seg="+t.value)}
  if(t.id==="aop"){nav("#/auditoria"+(t.value?"?op="+t.value:""))}
  if(t.dataset.chg==="papel"){S.users.find(u=>u.u===t.dataset.u).papel=t.value;log("Papel alterado",t.dataset.u+" → "+t.value);toast("Papel atualizado")}
  if(t.dataset.cond)syncDraft();
});
let busT;document.addEventListener("input",e=>{if(e.target.id==="busca"){clearTimeout(busT);busT=setTimeout(()=>{const{q}=parse();const v=e.target.value;nav(`#/clientes?q=${encodeURIComponent(v)}&c=${encodeURIComponent(q.c||"Todos")}`);setTimeout(()=>{const i=$("#busca");i&&(i.focus(),i.setSelectionRange(v.length,v.length))},260)},350)}});
document.addEventListener("submit",e=>{
  const f=e.target;if(f.id==="dlgf")return;e.preventDefault();
  if(f.id==="flogin"){const u=$("#lu").value.trim(),s=$("#ls").value;const us=S.users.find(x=>x.u===u&&x.ativo);if(!us||!s||s==="errada"){$("#root").innerHTML=entrar({k:"crit",t:"Usuário ou senha incorretos."});return}S.session=us;S.expirou=false;log("Entrou","Sessão iniciada");nav(FIRST[us.papel]);route(true)}
  if(f.id==="fnovo"){const n=$("#nome").value.trim(),m=$("#email").value.trim();setErr("nome","");setErr("email","");let bad=false;if(n.length<3){setErr("nome","Informe o nome completo.");bad=true}if(!/^\S+@\S+\.\S+$/.test(m)){setErr("email","Informe um e-mail válido.");bad=true}if(bad)return;const id="c-"+String(S.clients.length+1).padStart(3,"0");S.clients.unshift({id,nome:n,email:m,cadastro:new Date().toISOString(),ativo:true,eliminado:false,cons:{seg:mkCons("NAO_CONCEDIDO"),pub:mkCons("NAO_CONCEDIDO")},events:[],proc:null,fail:null,pedido:null});log("Cliente cadastrado",id);nav("#/clientes/"+id);toast("Cliente cadastrado")}
  if(f.id==="fev"){const c=cli(parse().parts[1]),fd=Object.fromEntries(new FormData(f)),v=Number(String(fd.v).replace(",","."))||0;if(fd.t==="buy"&&!(v>0)){$("#evt-e").textContent="Compra precisa de valor maior que zero.";return}c.events.unshift({t:fd.t,cat:fd.cat,v:fd.t==="buy"?v:0,q:new Date().toISOString(),origem:fd.origem});log("Evento registrado",c.id);draw();toast("Evento registrado")}
  if(f.id==="fcorr"){const c=cli(parse().parts[1]);c.nome=$("#cn").value.trim()||c.nome;c.email=$("#ce").value.trim()||c.email;log("Cadastro corrigido",c.id);draw();toast("Cadastro corrigido")}
  if(f.id==="fseg"){syncDraft();const D=DRAFT;setErr("sn","");$("#cond-e").textContent="";if(!D.nome.trim()){setErr("sn","Informe o nome do segmento.");return}const bad=D.conds.findIndex(x=>isNaN(Number(String(x.v).replace(",","."))));if(bad>=0){$("#cond-e").textContent=`Condição ${bad+1} (${CAMPO[D.conds[bad].c]}): o valor precisa ser um número.`;return}D.mode="save";nav("#/segmentos/previa")}
  if(f.id==="fprod"){const nome=$("#pn").value.trim(),cat=$("#pc").value.trim().toLowerCase(),pr=Number($("#pp").value.replace(",","."));setErr("pn","");setErr("pp","");let bad=false;if(!nome){setErr("pn","Informe o nome.");bad=true}if(!(pr>0)){setErr("pp","Informe o preço com vírgula, por exemplo 89,90.");bad=true}if(!cat){setErr("pc","Informe a categoria.");bad=true}if(bad)return;
    if(f.dataset.id==="novo"){S.catalogo.push({id:"p-"+(S.catalogo.length+1),cat,nome,preco:pr,ativo:true});if(!CATS.includes(cat))CATS.push(cat)}else Object.assign(S.catalogo.find(x=>x.id===f.dataset.id),{nome,cat,preco:pr});log("Produto salvo",nome);nav("#/catalogo");toast("Produto salvo")}
  if(f.id==="fsenha"){const a=$("#s1").value,b=$("#s2").value;setErr("s1","");setErr("s2","");if(a.length<8){setErr("s1","A nova senha precisa ter pelo menos 8 caracteres.");return}if(a!==b){setErr("s2","As senhas não são iguais.");return}log("Senha trocada",S.session.u);f.reset();toast("Senha alterada")}
  if(f.id==="fpe"){const m=$("#pe").value.trim().toLowerCase(),c=S.clients.find(x=>x.email===m&&!x.eliminado);const tok=(c?"t"+Math.random().toString(36).slice(2,8):"nada");if(c){S.tokens[tok]={id:c.id,used:false,exp:Date.now()+30*60*1e3};S.outbox.unshift({para:c.email,assunto:"Seu link de acesso ao Perfila",q:new Date().toISOString(),txt:`Abra este link para entrar: #/titular/acesso?t=${tok}`})}S.lastTok=c?tok:"nada";route(true)}
});
/* esqueleto de arquivo: o input de arquivo precisa sobreviver a draw() */
route(true);
</script>
